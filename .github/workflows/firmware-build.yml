
name: FUMI Firmware Build

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "scripts/setup-waveshare.sh"
      - ".github/workflows/firmware-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "firmware/**"
      - "scripts/setup-waveshare.sh"
      - ".github/workflows/firmware-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware-build:
    name: ESP32-S3 Firmware Compile
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Waveshare sketch
        run: bash scripts/setup-waveshare.sh

        
      - name: Fix ESP-SR command compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("firmware/build/LVGL_Arduino/MIC_MSM.cpp")
          s = p.read_text()

          replacements = {
              '{0, "Turn on the backlight", "TkN nN jc BaKLiT"}':
                  '{0, "Turn on the backlight"}',
              '{1, "Turn off the backlight", "TkN eF jc BaKLiT"}':
                  '{1, "Turn off the backlight"}',
              '{2, "backlight is brightest", "BaKLiT gZ BRiTcST"}':
                  '{2, "backlight is brightest"}',
              '{3, "backlight is darkest", "BaKLiT gZ DnRKcST"}':
                  '{3, "backlight is darkest"}',
              '{4, "play music", "PLd MYoZgK"}':
                  '{4, "play music"}',
          }

          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f"Expected source entry not found: {old}")
              s = s.replace(old, new, 1)

          p.write_text(s)
          print("ESP-SR commands adapted for ESP32 core 3.3.12")
          PY


      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 platform
        run: |
          arduino-cli config init
          arduino-cli core update-index \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Install LVGL
        run: arduino-cli lib install "lvgl@8.3.10"
      
      - name: Compile FUMI
        run: |
          arduino-cli compile \
            --output-dir firmware/build/artifacts \
            --fqbn "esp32:esp32:esp32s3:FlashSize=16M,FlashMode=qio,PSRAM=opi,PartitionScheme=huge_app" \
            --libraries firmware/vendor/waveshare/example/Arduino-3.1.1/libraries \
            firmware/build/LVGL_Arduino

            
      - name: Create firmware usage guide
        run: |
          cat > firmware/build/artifacts/README.txt <<'EOF'
          FUMI Firmware Build
          ===================

          This artifact was generated by GitHub Actions.

          TARGET BOARD
          - Waveshare ESP32-S3 Touch LCD 1.46
          - ESP32 Arduino core 3.3.12
          - Flash size: 16 MB
          - PSRAM: OPI
          - Partition scheme: Huge APP

          FILES
          - LVGL_Arduino.ino.bin
            Main application firmware.

          - LVGL_Arduino.ino.bootloader.bin
            Bootloader binary.

          - LVGL_Arduino.ino.partitions.bin
            Partition table binary.

          - LVGL_Arduino.ino.merged.bin
            Merged flash image. Verify flash offsets and
            board configuration before using it.

          - LVGL_Arduino.ino.nopartitions.bin
            Application image without the partition table.

          - LVGL_Arduino.ino.map
            Build symbol and memory map information.

          IMPORTANT
          - This build has not necessarily been tested on hardware.
          - Do not flash files until the correct flash offsets,
            partition layout, and upload procedure are verified.
          - Back up your working firmware before replacing it.
          - Never include Wi-Fi passwords, API keys, or tokens
            in public artifacts.

          Build commit: see the GitHub Actions run that produced
          this artifact.
          EOF


      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fumi-firmware-${{ github.sha }}
          path: firmware/build/artifacts/
          if-no-files-found: error
          retention-days: 14

